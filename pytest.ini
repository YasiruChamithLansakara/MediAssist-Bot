[pytest]

# ------------------------------------
# TEST DISCOVERY
# ------------------------------------
pythonpath = .
testpaths = tests

# ------------------------------------
# OUTPUT / COVERAGE
# ------------------------------------
addopts = -q --cov=app --cov-report=html

# ------------------------------------
# ASYNC SUPPORT (FastAPI / HTTPX)
# ------------------------------------
asyncio_mode = auto

# ------------------------------------
# WARNING HANDLING
# ------------------------------------
filterwarnings =
    ignore::DeprecationWarning

# ------------------------------------
# CUSTOM MARKERS (IMPORTANT)
# ------------------------------------
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (API / DB)
    slow: Slow tests (RAG / FAISS / embeddings)
    rag: RAG system tests (FAISS + retrieval)
    ocr: OCR pipeline tests
    api: FastAPI endpoint tests